# The unit tests and the typecheck. Neither needs a screen reader; the readers
# themselves are proved on the rig. macOS rather than Linux: Guidepup builds a
# screen reader when it is imported and throws on any platform with neither
# VoiceOver nor NVDA, which fails every test file that imports it.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        # The packages' oldest supported Node, and the current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
